name: flutter_chat_app
description: A production-quality Flutter chat application with LLM integration, Google Sign-In, and cloud sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Authentication
  google_sign_in: ^6.2.1
  firebase_auth: ^4.15.3
  firebase_core: ^2.24.2

  # Cloud Storage
  cloud_firestore: ^4.13.6

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # HTTP & Streaming
  http: ^1.1.2
  dio: ^5.4.0

  # UI
  flutter_markdown: ^0.6.18+2
  intl: ^0.18.1
  uuid: ^4.2.2

  # Utils
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
